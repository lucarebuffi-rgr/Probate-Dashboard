<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Georgia Daily Probates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1420;
    --surface: #171F30;
    --surface-hover: #1E2740;
    --text: #E7EAF2;
    --text-soft: #8B93AB;
    --border: #262F45;
    --border-strong: #3A4560;
    --accent-gold: #F0B93B;
    --accent-gold-text: #241A03;
    --accent-blue: #4C8DFF;
    --accent-county-bg: #26314A;
    --accent-county-text: #B9C4DE;
    --accent-flag-bg: #C2680A;
    --new-bg: #2563EB;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .masthead {
    border-bottom: 1px solid var(--border);
    padding: 22px 32px;
    background: var(--surface);
  }

  .masthead-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  #logo-img { height: 54px; width: auto; }

  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .masthead-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  .masthead-stats {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-soft);
    text-align: right;
  }

  .masthead-stats strong { color: var(--text); font-weight: 600; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
  }

  .toolbar-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .toolbar-row + .toolbar-row { margin-top: 10px; }

  .field-group { display: flex; align-items: center; gap: 8px; }

  .field-group label { font-size: 12px; color: var(--text-soft); white-space: nowrap; }

  input[type="date"], input[type="search"], select {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 6px 9px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }

  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }

  input[type="search"] { width: 220px; }
  input[type="search"]::placeholder { color: var(--text-soft); }

  .chip, .toggle-flag {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    cursor: pointer;
    color: var(--text-soft);
    user-select: none;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }

  .chip.active {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: white;
  }

  .toggle-flag.active {
    background: var(--new-bg);
    border-color: var(--new-bg);
    color: white;
  }

  .spacer { flex: 1; }

  .result-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text-soft);
  }

  .export-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent-blue);
    background: var(--accent-blue);
    color: white;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .export-btn.scrape-btn {
    border-color: var(--accent-gold);
    background: var(--accent-gold);
    color: var(--accent-gold-text);
  }

  .export-btn:hover { opacity: 0.88; }

  .export-btn:disabled {
    background: var(--surface);
    color: var(--text-soft);
    border-color: var(--border);
    cursor: default;
  }

  main {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 32px 60px;
    overflow-x: auto;
  }

  table { width: 100%; border-collapse: collapse; }

  thead tr.group-row th {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-soft);
    text-align: center;
    padding: 4px 8px 2px;
    border-bottom: none;
  }

  thead tr.field-row th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    padding: 4px 10px 8px;
    border-bottom: 1.5px solid var(--border-strong);
    cursor: pointer;
    white-space: nowrap;
  }

  thead tr.field-row th.no-sort { cursor: default; }
  thead tr.field-row th:hover:not(.no-sort) { color: var(--text); }

  thead th .sort-arrow { opacity: 0.4; margin-left: 3px; font-size: 10px; }
  thead th.sorted .sort-arrow { opacity: 1; }

  .col-group-border { border-left: 1px solid var(--border); }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--surface-hover); }
  tbody tr.selected { background: #24304C; }

  td {
    padding: 10px;
    vertical-align: top;
    font-size: 13.5px;
    white-space: nowrap;
  }

  td.wrap-cell { white-space: normal; max-width: 200px; }
  td.checkbox-cell { padding-left: 14px; padding-right: 4px; }
  td.date-cell { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-soft); }
  td.name-cell { font-weight: 500; white-space: normal; max-width: 180px; }
  td.addr-part { color: var(--text-soft); }
  td.zip-cell { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-soft); }

  .no-address { color: var(--text-soft); font-style: italic; opacity: 0.7; }

  .county-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--accent-county-bg);
    color: var(--accent-county-text);
  }

  .flag-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--accent-flag-bg);
    color: white;
    margin-left: 6px;
    white-space: nowrap;
  }

  .new-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--new-bg);
    color: white;
    margin-left: 6px;
    white-space: nowrap;
  }

  input[type="checkbox"] {
    width: 15px;
    height: 15px;
    cursor: pointer;
    accent-color: var(--accent-blue);
  }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-soft); }
  .empty-state h2 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; color: var(--text); margin-bottom: 6px; }

  @media (max-width: 900px) {
    .masthead, .toolbar { padding-left: 16px; padding-right: 16px; }
    input[type="search"] { width: 140px; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <h1>Georgia Daily Probates</h1>
    </div>
    <div class="masthead-right">
      <img id="logo-img" src="logo.png" alt="" onerror="this.style.display='none'">
      <div class="masthead-stats" id="masthead-stats">Loading&hellip;</div>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="toolbar-row" style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; width:100%;">
      <div class="field-group">
        <label for="from-date">Filed from</label>
        <input type="date" id="from-date">
      </div>
      <div class="field-group">
        <label for="to-date">to</label>
        <input type="date" id="to-date">
      </div>
      <div class="field-group county-chips" id="county-chips"></div>
      <span class="toggle-flag" id="new-only-toggle">New Filings</span>
      <input type="search" id="search-box" placeholder="Search name or case #">
      <div class="spacer"></div>
      <a class="export-btn scrape-btn" href="scrapenow://run" title="Requires one-time setup on your Mac — see README">Scrape New Records</a>
      <button class="export-btn" id="export-btn">Export CSV</button>
      <div class="result-count" id="result-count"></div>
    </div>
  </div>
</div>

<main>
  <table id="leads-table">
    <thead>
      <tr class="group-row">
        <th></th>
        <th></th>
        <th></th>
        <th></th>
        <th colspan="4" class="col-group-border">Decedent address</th>
        <th colspan="2" class="col-group-border">Personal representative</th>
        <th colspan="4" class="col-group-border">Mailing address</th>
        <th></th>
      </tr>
      <tr class="field-row">
        <th class="no-sort"><input type="checkbox" id="select-all-checkbox" title="Select all"></th>
        <th data-sort="dateFiled">Filed <span class="sort-arrow">&#9660;</span></th>
        <th data-sort="county">County <span class="sort-arrow">&#9660;</span></th>
        <th data-sort="decedentName">Decedent <span class="sort-arrow">&#9660;</span></th>
        <th class="col-group-border">Address</th>
        <th>City</th>
        <th>State</th>
        <th>Zip</th>
        <th class="col-group-border">First</th>
        <th data-sort="petitionerName">Last <span class="sort-arrow">&#9660;</span></th>
        <th class="col-group-border">Address</th>
        <th>City</th>
        <th>State</th>
        <th>Zip</th>
        <th data-sort="caseNumber">Case # <span class="sort-arrow">&#9660;</span></th>
      </tr>
    </thead>
    <tbody id="leads-body"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none;">
    <h2>No filings match these filters</h2>
    <p>Try widening the date range or clearing a filter.</p>
  </div>
</main>

<script>
let allLeads = [];
let filteredLeads = [];
let sortField = 'dateFiled';
let sortDir = 'desc';
let activeCounties = new Set();
let newOnly = false;
let selectedIds = new Set();

// ---------- County name cleanup ----------
function shortCounty(full) {
  if (!full) return 'Unknown';
  let s = full;
  s = s.replace(/\bCounty\b/gi, '');
  s = s.replace(/\bProbate Court\b/gi, '');
  s = s.replace(/\bSuperior Court\b/gi, '');
  s = s.replace(/\s+A\s*$/i, ''); // trailing lone "A" division marker (Forsyth's second court)
  s = s.replace(/[-–—]+/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s || full;
}

// ---------- Address parsing ----------
const STATE_NAMES = {
  'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA','colorado':'CO',
  'connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA','hawaii':'HI','idaho':'ID',
  'illinois':'IL','indiana':'IN','iowa':'IA','kansas':'KS','kentucky':'KY','louisiana':'LA',
  'maine':'ME','maryland':'MD','massachusetts':'MA','michigan':'MI','minnesota':'MN',
  'mississippi':'MS','missouri':'MO','montana':'MT','nebraska':'NE','nevada':'NV',
  'new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC',
  'north dakota':'ND','ohio':'OH','oklahoma':'OK','oregon':'OR','pennsylvania':'PA',
  'rhode island':'RI','south carolina':'SC','south dakota':'SD','tennessee':'TN','texas':'TX',
  'utah':'UT','vermont':'VT','virginia':'VA','washington':'WA','west virginia':'WV',
  'wisconsin':'WI','wyoming':'WY'
};

function normalizeState(raw) {
  if (!raw) return '';
  const trimmed = raw.trim();
  if (trimmed.length === 2) return trimmed.toUpperCase();
  return STATE_NAMES[trimmed.toLowerCase()] || trimmed;
}

// Standard USPS street-suffix and directional abbreviations. Applied as
// whole-word, case-insensitive replacements so "Northside" or "Portage"
// never get mangled by a partial match on "North" or "Port".
const STREET_ABBREVIATIONS = {
  'Alley':'Aly','Annex':'Anx','Avenue':'Ave','Bend':'Bnd','Bluff':'Blf','Boulevard':'Blvd',
  'Branch':'Br','Bridge':'Brg','Brook':'Brk','Bypass':'Byp','Camp':'Cp','Canyon':'Cyn',
  'Causeway':'Cswy','Center':'Ctr','Circle':'Cir','Cliff':'Clf','Club':'Clb','Corner':'Cor',
  'Court':'Ct','Cove':'Cv','Creek':'Crk','Crescent':'Cres','Crossing':'Xing','Curve':'Curv',
  'Dale':'Dl','Dam':'Dm','Divide':'Dv','Drive':'Dr','Estate':'Est','Expressway':'Expy',
  'Extension':'Ext','Falls':'Fls','Ferry':'Fry','Field':'Fld','Flat':'Flt','Ford':'Frd',
  'Forest':'Frst','Forge':'Frg','Fork':'Frk','Fort':'Ft','Freeway':'Fwy','Garden':'Gdn',
  'Gateway':'Gtwy','Glen':'Gln','Green':'Grn','Grove':'Grv','Harbor':'Hbr','Haven':'Hvn',
  'Heights':'Hts','Highway':'Hwy','Hill':'Hl','Hills':'Hls','Hollow':'Holw','Inlet':'Inlt',
  'Island':'Is','Junction':'Jct','Key':'Ky','Knoll':'Knl','Lake':'Lk','Landing':'Lndg',
  'Lane':'Ln','Light':'Lgt','Lock':'Lck','Lodge':'Ldg','Manor':'Mnr','Meadow':'Mdw',
  'Mill':'Ml','Mission':'Msn','Mount':'Mt','Mountain':'Mtn','Neck':'Nck','Orchard':'Orch',
  'Overpass':'Opas','Parkway':'Pkwy','Pine':'Pne','Place':'Pl','Plain':'Pln','Plaza':'Plz',
  'Point':'Pt','Port':'Prt','Prairie':'Pr','Ramp':'Ramp','Ranch':'Rnch','Rapid':'Rpd',
  'Rest':'Rst','Ridge':'Rdg','River':'Riv','Road':'Rd','Route':'Rte','Shoal':'Shl',
  'Shore':'Shr','Skyway':'Skwy','Spring':'Spg','Spur':'Spur','Square':'Sq','Station':'Sta',
  'Stream':'Strm','Street':'St','Summit':'Smt','Terrace':'Ter','Trace':'Trce','Track':'Trak',
  'Trafficway':'Trfy','Trail':'Trl','Tunnel':'Tunl','Turnpike':'Tpke','Union':'Un',
  'Valley':'Vly','Viaduct':'Via','View':'Vw','Village':'Vlg','Vista':'Vis','Wall':'Wall',
  'Well':'Wl',
  'Northeast':'NE','Northwest':'NW','Southeast':'SE','Southwest':'SW',
  'North':'N','South':'S','East':'E','West':'W',
};

function abbreviateStreet(street) {
  if (!street) return street;
  let result = street;
  for (const [full, abbr] of Object.entries(STREET_ABBREVIATIONS)) {
    result = result.replace(new RegExp(`\\b${full}\\b`, 'gi'), abbr);
  }
  return result;
}

// Detects an apartment/unit designator, whether it shows up embedded in
// the street ("123 Main St Apt 4B") or as its own comma-separated segment
// ("123 Main St, Apt 4B, Atlanta...").
const APARTMENT_PATTERN = /\b(apt|apartment|unit|ste|suite)\b\.?\s*\S*|#\s*\S+/i;

function isApartmentSegment(segment) {
  return /^\s*(apt|apartment|unit|ste|suite)\b/i.test(segment) || /^\s*#/.test(segment);
}

function isApartmentAddress(rawAddr) {
  return !!rawAddr && APARTMENT_PATTERN.test(rawAddr);
}

// Counties this register covers. Used only to disambiguate addresses that
// have just ONE word between the street and the state (e.g. "123 Main St,
// Fulton, GA 30349") — in the real data, that lone word is sometimes the
// county (with the city field left blank on the original form) rather
// than an actual city name. If it matches a known county, we treat it as
// the dropped county and leave city blank, instead of mislabeling a
// county as if it were the city.
const KNOWN_COUNTIES = new Set(['fulton', 'rockdale', 'cherokee', 'cobb', 'forsyth', 'gwinnett', 'glynn']);

function parseAddress(addr) {
  if (!addr) return null;

  const stateZipRegex = /([A-Za-z]{2,})\s*,?\s*(\d{5}(?:-\d{4})?)\s*$/;
  const match = addr.match(stateZipRegex);

  let state = '';
  let zip = '';
  let rest = addr;

  if (match) {
    state = normalizeState(match[1]);
    zip = match[2];
    rest = addr.slice(0, match.index).trim().replace(/,\s*$/, '');
  }

  let parts = rest.split(',').map(p => p.trim()).filter(Boolean);
  let street = parts.length > 0 ? parts[0] : rest;
  let remaining = parts.slice(1);

  // If the very next segment is an apartment/unit designator (e.g. "Apt.
  // 6" showing up as its own comma-separated piece), fold it into the
  // street line rather than mistaking it for the city.
  if (remaining.length > 0 && isApartmentSegment(remaining[0])) {
    street = street + ' ' + remaining[0];
    remaining = remaining.slice(1);
  }

  let city = '';
  if (remaining.length === 1) {
    // Ambiguous: could be city, could be a county with city left blank.
    city = KNOWN_COUNTIES.has(remaining[0].toLowerCase()) ? '' : remaining[0];
  } else if (remaining.length >= 2) {
    city = remaining[0]; // first = city; remaining (usually county) dropped
  }

  return { street: properCaseAddressPart(abbreviateStreet(street)), city: properCaseAddressPart(city), state, zip };
}

// ---------- ZIP-code city correction ----------
// A ZIP code reliably maps to one city (that's how USPS delivers mail),
// so it's a more trustworthy source for the city name than handwriting
// OCR. We look up each unique ZIP once via a free public postal lookup
// and use that to correct/fill in the city. If the lookup fails for any
// reason (offline, ZIP not found, etc.), we just fall back to whatever
// city was read off the original document — nothing breaks.
let zipCache = {};

async function fetchZipInfo(zip) {
  if (zipCache.hasOwnProperty(zip)) return zipCache[zip];
  try {
    const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
    if (!res.ok) { zipCache[zip] = null; return null; }
    const data = await res.json();
    const place = data.places && data.places[0];
    const info = place ? { city: place['place name'], state: place['state abbreviation'] } : null;
    zipCache[zip] = info;
    return info;
  } catch (e) {
    zipCache[zip] = null;
    return null;
  }
}

async function preloadZipCorrections() {
  const zips = new Set();
  allLeads.forEach(l => {
    [l.decedentAddress, l.mailingAddress].forEach(addr => {
      const parsed = parseAddress(addr);
      if (parsed && /^\d{5}$/.test(parsed.zip)) zips.add(parsed.zip);
    });
  });
  const uniqueZips = [...zips];
  const concurrency = 6; // be polite to the free lookup service
  for (let i = 0; i < uniqueZips.length; i += concurrency) {
    const batch = uniqueZips.slice(i, i + concurrency);
    await Promise.all(batch.map(fetchZipInfo));
  }
}

// Returns parsed address parts, using the ZIP-verified city/state when
// available, otherwise falling back to what was read off the document.
function correctedAddressParts(addr) {
  const parsed = parseAddress(addr);
  if (!parsed) return null;
  const info = parsed.zip ? zipCache[parsed.zip] : null;
  if (info) {
    return { street: parsed.street, city: properCaseAddressPart(info.city) || parsed.city, state: info.state || parsed.state, zip: parsed.zip };
  }
  return parsed;
}

// Court data stores names as "Last, First Middle" (and sometimes a
// suffix after a second comma, e.g. "Smith, John, Jr"). We only want the
// first name (dropping any middle name/initial) and the last name, each
// with simple proper capitalization (first letter up, rest lowercase).
function properCase(word) {
  if (!word) return '';
  const cleaned = word.replace(/[.,]+$/, '');
  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
}

function splitPersonalRepName(fullName) {
  if (!fullName) return { first: '', last: '' };

  const commaIndex = fullName.indexOf(',');
  let last = '', firstChunk = '';

  if (commaIndex !== -1) {
    last = fullName.slice(0, commaIndex).trim();
    firstChunk = fullName.slice(commaIndex + 1).trim();
    const secondComma = firstChunk.indexOf(','); // drop a trailing suffix like ", Jr"
    if (secondComma !== -1) firstChunk = firstChunk.slice(0, secondComma).trim();
  } else {
    const parts = fullName.trim().split(/\s+/);
    if (parts.length === 1) { firstChunk = parts[0]; }
    else { last = parts[parts.length - 1]; firstChunk = parts.slice(0, -1).join(' '); }
  }

  const firstWord = firstChunk.split(/\s+/)[0] || ''; // drop middle name/initial
  return { first: properCase(firstWord), last: properCase(last) };
}

function todayLocalIso() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function isNewLead(l) {
  return !!l.firstSeenDate && l.firstSeenDate === todayLocalIso();
}

function formatDate(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function isoDateOnly(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toISOString().slice(0, 10);
}

async function loadLeads() {
  try {
    const res = await fetch('leads.json?t=' + Date.now());
    allLeads = await res.json();
  } catch (e) {
    document.getElementById('masthead-stats').textContent = 'Could not load leads.json';
    return;
  }
  buildCountyChips();
  setDefaultDateRange();
  applyFilters();

  document.getElementById('masthead-stats').innerHTML += ' &middot; <em>verifying cities&hellip;</em>';
  await preloadZipCorrections();
  render(); // re-render with corrected cities now that lookups are in
}

function buildCountyChips() {
  const counties = [...new Set(allLeads.map(l => l.county).filter(Boolean))].sort();
  const container = document.getElementById('county-chips');
  container.innerHTML = '';
  counties.forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = shortCounty(c);
    chip.addEventListener('click', () => {
      if (activeCounties.has(c)) { activeCounties.delete(c); chip.classList.remove('active'); }
      else { activeCounties.add(c); chip.classList.add('active'); }
      applyFilters();
    });
    container.appendChild(chip);
  });
}

function setDefaultDateRange() {
  const dates = allLeads.map(l => isoDateOnly(l.dateFiled)).filter(Boolean).sort();
  if (dates.length === 0) return;
  const latest = dates[dates.length - 1];
  const weekAgo = new Date(latest);
  weekAgo.setDate(weekAgo.getDate() - 7);
  document.getElementById('to-date').value = latest;
  document.getElementById('from-date').value = weekAgo.toISOString().slice(0, 10);
}

function applyFilters() {
  const fromVal = document.getElementById('from-date').value;
  const toVal = document.getElementById('to-date').value;
  const searchVal = document.getElementById('search-box').value.trim().toLowerCase();

  filteredLeads = allLeads.filter(l => {
    if (isApartmentAddress(l.decedentAddress)) return false; // decedent didn't own real property here
    if (!hasUsableDecedentAddress(l)) return false; // no usable street+zip found yet (blurry doc, vague entry like "Orange County, California", missing petition, etc.)
    const filedDate = isoDateOnly(l.dateFiled);
    if (fromVal && filedDate && filedDate < fromVal) return false;
    if (toVal && filedDate && filedDate > toVal) return false;
    if (activeCounties.size > 0 && !activeCounties.has(l.county)) return false;
    if (newOnly && !isNewLead(l)) return false;
    if (searchVal) {
      const haystack = [l.decedentName, l.petitionerName, l.caseNumber].filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(searchVal)) return false;
    }
    return true;
  });

  sortLeads();
  render();
}

function sortLeads() {
  filteredLeads.sort((a, b) => {
    let av = a[sortField] || '';
    let bv = b[sortField] || '';
    if (sortField === 'dateFiled') {
      av = new Date(av || 0).getTime();
      bv = new Date(bv || 0).getTime();
    } else {
      av = String(av).toLowerCase();
      bv = String(bv).toLowerCase();
    }
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

// Some petitions just write "Same" (meaning same as the decedent's
// address above) or "See Exhibit A" (meaning it's attached separately,
// not written on the form) instead of an actual mailing address. In
// either case, the decedent's own address is the best available stand-in
// — showing the placeholder text itself as if it were a street would be
// misleading.
const PLACEHOLDER_ADDRESS_PATTERN = /^(same\b|see\s+exhibit|see\s+attached|exhibit\s)/i;

// Turns ALL CAPS (or all lowercase) text into normal Title Case, while
// keeping directional abbreviations correctly uppercase (NE, not Ne) and
// leaving anything with a digit in it untouched (so unit numbers like
// "4B" don't get incorrectly lowercased to "4b").
const KEEP_UPPERCASE_WORDS = new Set(['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']);

function properCaseWord(word) {
  if (!word) return word;
  if (/\d/.test(word)) return word;
  const lower = word.toLowerCase();
  if (KEEP_UPPERCASE_WORDS.has(lower)) return word.toUpperCase();
  return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
}

function properCaseAddressPart(str) {
  if (!str) return str;
  return str.split(/\s+/).map(properCaseWord).join(' ');
}

function isPlaceholderAddress(raw) {
  return !!raw && PLACEHOLDER_ADDRESS_PATTERN.test(raw.trim());
}

function isUsableMailingAddress(raw) {
  if (isPlaceholderAddress(raw)) return false;
  const parsed = parseAddress(raw);
  if (!parsed || !parsed.street || !parsed.zip) return false;
  // Catches nonsense entries like street="Atlanta" city="Atlanta" — a
  // clear sign the form didn't have a real street written on it, even
  // though a zip happens to be present.
  if (parsed.city && parsed.street.toLowerCase() === parsed.city.toLowerCase()) return false;
  return true;
}

function effectiveMailingAddress(l) {
  return isUsableMailingAddress(l.mailingAddress) ? l.mailingAddress : (l.decedentAddress || null);
}

function hasUsableDecedentAddress(l) {
  return !!usableAddressParts(l.decedentAddress);
}

function usableAddressParts(addr) {
  const parsed = correctedAddressParts(addr);
  return (parsed && parsed.street && parsed.zip) ? parsed : null;
}

function addressCells(addr) {
  const parsed = usableAddressParts(addr);
  if (!parsed) {
    return `<td class="addr-part wrap-cell col-group-border no-address">Not found yet</td><td class="addr-part wrap-cell no-address">&mdash;</td><td class="addr-part no-address">&mdash;</td><td class="zip-cell no-address">&mdash;</td>`;
  }
  return `
    <td class="addr-part wrap-cell col-group-border">${parsed.street || '\u2014'}</td>
    <td class="addr-part wrap-cell">${parsed.city || '\u2014'}</td>
    <td class="addr-part">${parsed.state || '\u2014'}</td>
    <td class="zip-cell">${parsed.zip || '\u2014'}</td>
  `;
}

function render() {
  const tbody = document.getElementById('leads-body');
  const emptyState = document.getElementById('empty-state');
  tbody.innerHTML = '';

  const table = document.getElementById('leads-table');
  if (filteredLeads.length === 0) {
    emptyState.style.display = 'block';
    table.style.display = 'none';
  } else {
    emptyState.style.display = 'none';
    table.style.display = 'table';
  }

  filteredLeads.forEach(l => {
    const tr = document.createElement('tr');
    if (selectedIds.has(l.caseDataID)) tr.classList.add('selected');
    const rep = splitPersonalRepName(l.petitionerName);

    tr.innerHTML = `
      <td class="checkbox-cell"><input type="checkbox" class="row-checkbox" data-id="${l.caseDataID}" ${selectedIds.has(l.caseDataID) ? 'checked' : ''}></td>
      <td class="date-cell">${formatDate(l.dateFiled)}</td>
      <td><span class="county-tag">${shortCounty(l.county)}</span>${isNewLead(l) ? '<span class="new-tag">New</span>' : ''}${l.isHotFlag ? '<span class="flag-tag">Leave to sell</span>' : ''}</td>
      <td class="name-cell">${l.decedentName || '\u2014'}</td>
      ${addressCells(l.decedentAddress)}
      <td class="name-cell col-group-border">${rep.first || '\u2014'}</td>
      <td class="name-cell">${rep.last || '\u2014'}</td>
      ${addressCells(effectiveMailingAddress(l))}
      <td class="date-cell">${l.caseDataID ? `<a href="https://researchga.tylerhost.net/CourtRecordsSearch/ui/case/${l.caseDataID}" target="_blank" rel="noopener" style="color:var(--accent-blue);">${l.caseNumber || '\u2014'}</a>` : (l.caseNumber || '\u2014')}</td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('.row-checkbox').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.id;
      if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
      cb.closest('tr').classList.toggle('selected', cb.checked);
      updateSelectAllState();
      updateExportButton();
    });
  });

  updateSelectAllState();
  updateExportButton();

  document.getElementById('result-count').textContent = `${filteredLeads.length} of ${allLeads.length} filings`;
  const withAddress = allLeads.filter(l => l.mailingAddress).length;
  document.getElementById('masthead-stats').innerHTML =
    `<strong>${allLeads.length}</strong> filings on record &middot; <strong>${withAddress}</strong> with an address found`;
}

function updateSelectAllState() {
  const box = document.getElementById('select-all-checkbox');
  const visibleIds = filteredLeads.map(l => l.caseDataID);
  const allSelected = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
  box.checked = allSelected;
}

function updateExportButton() {
  const btn = document.getElementById('export-btn');
  if (selectedIds.size > 0) {
    btn.textContent = `Export ${selectedIds.size} selected`;
  } else {
    btn.textContent = `Export all ${filteredLeads.length} filtered`;
  }
  btn.disabled = filteredLeads.length === 0;
}

function csvEscape(value) {
  const s = (value === null || value === undefined) ? '' : String(value);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCsv() {
  const rowsToExport = selectedIds.size > 0
    ? filteredLeads.filter(l => selectedIds.has(l.caseDataID))
    : filteredLeads;

  const headers = [
    'Filed Date', 'County', 'Case Type', 'Case Number', 'Case Link', 'Status',
    'Decedent Name', 'Decedent Street', 'Decedent City', 'Decedent State', 'Decedent Zip',
    'Personal Rep First', 'Personal Rep Last', 'Mailing Street', 'Mailing City', 'Mailing State', 'Mailing Zip',
    'Date of Death', 'Leave to Sell Flag'
  ];

  const rows = rowsToExport.map(l => {
    const d = usableAddressParts(l.decedentAddress) || {};
    const m = usableAddressParts(effectiveMailingAddress(l)) || {};
    const rep = splitPersonalRepName(l.petitionerName);
    const caseLink = l.caseDataID ? `https://researchga.tylerhost.net/CourtRecordsSearch/ui/case/${l.caseDataID}` : '';
    return [
      formatDate(l.dateFiled), shortCounty(l.county), l.caseType || '', l.caseNumber || '', caseLink, l.status || '',
      l.decedentName || '', d.street || '', d.city || '', d.state || '', d.zip || '',
      rep.first || '', rep.last || '', m.street || '', m.city || '', m.state || '', m.zip || '',
      l.dateOfDeath || '', l.isHotFlag ? 'Yes' : ''
    ];
  });

  const csvContent = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `probate-leads-${dateStamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('from-date').addEventListener('change', applyFilters);
document.getElementById('to-date').addEventListener('change', applyFilters);
document.getElementById('search-box').addEventListener('input', applyFilters);
document.getElementById('export-btn').addEventListener('click', exportCsv);

document.getElementById('select-all-checkbox').addEventListener('change', function() {
  if (this.checked) {
    filteredLeads.forEach(l => selectedIds.add(l.caseDataID));
  } else {
    filteredLeads.forEach(l => selectedIds.delete(l.caseDataID));
  }
  render();
});

document.getElementById('new-only-toggle').addEventListener('click', function() {
  newOnly = !newOnly;
  this.classList.toggle('active', newOnly);
  applyFilters();
});

document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortField = field; sortDir = field === 'dateFiled' ? 'desc' : 'asc'; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    sortLeads();
    render();
  });
});

loadLeads();
</script>
